name: CI

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Enable pnpm via corepack
        # Node's bundled corepack has stale signing keys and fails pnpm's
        # registry signature check ("Cannot find matching keyid"); install the
        # latest corepack first. See nodejs/corepack#612.
        run: |
          npm install --global corepack@latest
          corepack enable
      # ts0 is a public git dev dependency; pnpm runs git outside the checked-out
      # tree to fetch it. Runners have no SSH key, so rewrite ssh -> anonymous
      # https for the public repo before installing.
      - name: Use HTTPS for git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build single-file bundle
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # The sites serve route gives {branch} a single path segment, so a '/' in
      # the branch name (claude/foo) is slugified below to keep it one segment.
      - name: Publish public site to buildhost
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const server = "https://pazer.build";
            const su = new URL(server);
            const sitesBase = `${su.protocol}//sites.${su.host}`;
            const project = github.repository.split("/").pop()!;
            const branch = github.ref_name.replace(/\//g, "-");

            const idUrl = env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const idBearer = env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!idUrl || !idBearer) { core.setFailed("OIDC unavailable; need id-token: write"); return; }
            const idResp = await fetch(`${idUrl}&audience=${server}`, { headers: { Authorization: `Bearer ${idBearer}` } });
            const token: string = ((await idResp.json()) as { value: string }).value || "";
            if (!token) { core.setFailed("failed to obtain OIDC token"); return; }

            const tarPath = path.join(os.tmpdir(), "site.tar.gz");
            await exec.exec("tar", ["-czf", tarPath, "-C", "dist", "."]);
            const body = fs.readFileSync(tarPath);
            core.info(`Uploading ${body.length} bytes to ${sitesBase}/${project}/branch/${branch}`);

            const resp = await fetch(`${sitesBase}/${project}/branch/${branch}`, {
              method: "PUT",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/gzip",
                "X-Git-Commit": github.sha,
                "X-Public-Site": "true",
              },
              body,
            });
            const text = await resp.text();
            if (!resp.ok) { core.setFailed(`publish failed HTTP ${resp.status}: ${text}`); return; }
            const siteURL = `${sitesBase}/${project}/branch/${branch}/`;
            core.info(`Published public site: ${siteURL}`);
            core.summary.addRaw(`### Deployed\n\n${siteURL}\n`).write();
