name: CI

on:
  push:

permissions:
  id-token: write
  contents: read
  # buildhost-publish-site registers the publish as a GitHub Deployment (no
  # opt-out, and a failure fails the step), and its embedded no-all-builds-job
  # guard scans this run's jobs and the head commit's check runs.
  deployments: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ts0.cjs carries its own TypeScript compiler, and this project is
      # browser-target with no runtime dependencies, so nothing has to install
      # node_modules first. `test` type-checks the whole project (sources and
      # tests) before it runs anything, and `build` type-checks again before it
      # bundles -- a type error fails here, not silently at runtime.
      - name: Type-check and test
        uses: wow-look-at-my/ts0@master
        with:
          args: test
      - name: Build single-file bundle
        uses: wow-look-at-my/ts0@master
        with:
          args: build
      # github.ref_name goes in as-is: buildhost resolves a slash-named branch
      # (claude/foo) by longest match against its own site rows, so it needs no
      # slug and the site is addressed by the branch's real name.
      - name: Publish public site to buildhost
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          branch: ${{ github.ref_name }}
          source_dir: dist
          public: "true"

