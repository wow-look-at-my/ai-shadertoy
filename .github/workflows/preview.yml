name: PR Preview

# Deploys a per-PR preview of the single-file bundle to buildhost and posts a
# sticky comment with the preview URL. Push-based per-branch deploys are handled
# separately by ci.yml; this workflow adds the pull_request flavour (deploy to a
# pr-<number> branch + comment). Closed-PR cleanup is intentionally omitted --
# the buildhost-preview reusable workflow only deploys, so we do not subscribe
# to the `closed` event.
on:
  pull_request:
    types: [opened, reopened, synchronize]

# A reusable workflow cannot escalate beyond its caller, so the permissions
# buildhost-preview.yml declares must be granted here:
#   id-token: write      -> OIDC auth to buildhost (no static secret)
#   pull-requests: write -> sticky preview-URL comment
#   actions: read        -> download the build artifact via the Actions REST API
#   contents: read       -> checkout
permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm via corepack
        run: corepack enable
      # ts0 is a public git dev dependency; pnpm runs git outside the checked-out
      # tree to fetch it. Runners have no SSH key, so rewrite ssh -> anonymous
      # https for the public repo before installing.
      - name: Use HTTPS for git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - name: Build single-file bundle
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/

  preview:
    needs: build
    uses: wow-look-at-my/actions/.github/workflows/buildhost-preview.yml@master
    with:
      # Deploy the bundle built above (not a raw source-dir checkout).
      artifact-name: site
      # The repo is private but the per-branch deploys (ci.yml) are served
      # publicly via X-Public-Site, so keep PR previews public to match.
      public: true
    secrets: inherit
